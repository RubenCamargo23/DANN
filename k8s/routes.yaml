apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-db
  namespace: default
  labels:
    app: routes-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-db
  template:
    metadata:
      labels:
        app: routes-db
    spec:
      containers:
        - name: routes-db
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: routes_db
          volumeMounts:
            - name: routes-db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: routes-db-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: routes-db
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: routes-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routes-db-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: routes-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: routes-app
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app
  namespace: default
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      containers:
        - name: routes-app
          image: routes_app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: routes-db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: DB_NAME
              value: routes_db
---
apiVersion: v1
kind: Service
metadata:
  name: routes-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30002
