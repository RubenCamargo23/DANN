sonar.projectKey=organizacion-alternos_dann
sonar.organization=organizacion-alternos

sonar.projectName=DANN

# Monorepo: cada microservicio vive en su propia carpeta con su propio código en src/
sonar.sources=users_app/src,routes_app/src,posts_app/src,offers_app/src
sonar.tests=users_app/tests,routes_app/tests,posts_app/tests,offers_app/tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Reportes de cobertura de cada app (formato coverage.py XML, generados por pytest-cov)
sonar.python.coverage.reportPaths=users_app/coverage.xml,routes_app/coverage.xml,posts_app/coverage.xml,offers_app/coverage.xml
