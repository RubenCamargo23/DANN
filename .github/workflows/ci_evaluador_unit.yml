name: Flujo de CI
# Actualice este pipeline si usted decide trabajar en una tecnología diferente a Python

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unittest-users_app:
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    name: Verify users_app
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1
      - name: Run unit tests
        run: make unittest DIR=users_app

  unittest-routes_app:
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    name: Verify routes_app
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1
      - name: Run unit tests
        run: make unittest DIR=routes_app

  unittest-posts_app:
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    name: Verify posts_app
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1
      - name: Run unit tests
        run: make unittest DIR=posts_app

  unittest-offers_app:
    if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop') || github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    name: Verify offers_app
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1
      - name: Run unit tests
        run: make unittest DIR=offers_app

  release-develop:
    name: Create release branch and PR
    needs: [unittest-users_app, unittest-routes_app, unittest-posts_app, unittest-offers_app]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.next_version.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Skip if develop has no new commits over main
        id: check_new_commits
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "develop is already merged into main, nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch version from latest tag
        if: steps.check_new_commits.outputs.skip == 'false'
        id: next_version
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest_tag" ]; then
            next="0.1.0"
          else
            version="${latest_tag#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "branch=release/$next" >> "$GITHUB_OUTPUT"

      - name: Configure git as github-actions bot
        if: steps.check_new_commits.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release branch
        if: steps.check_new_commits.outputs.skip == 'false'
        run: |
          git checkout -b "${{ steps.next_version.outputs.branch }}"
          git push origin "${{ steps.next_version.outputs.branch }}"

      - name: Open and merge PR to main
        if: steps.check_new_commits.outputs.skip == 'false'
        run: |
          pr_url=$(gh pr create \
            --base main \
            --head "${{ steps.next_version.outputs.branch }}" \
            --title "Release ${{ steps.next_version.outputs.version }}" \
            --body "PR automático de GitFlow: \`develop\` pasó pruebas unitarias, liberando \`${{ steps.next_version.outputs.branch }}\` hacia \`main\`.")
          echo "PR created: $pr_url"
          gh pr merge --squash --admin "$pr_url"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  tag-sync-cleanup:
    name: Tag, sync develop and delete release branch
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Extract version from branch name
        id: version
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          version="${branch#release/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure git as github-actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Sync develop with main (merge-back)
        run: |
          git fetch origin develop
          git checkout develop
          git reset --hard origin/main
          git push origin develop --force-with-lease

      - name: Delete temporary release branch
        run: |
          git push origin --delete "${{ github.event.pull_request.head.ref }}"

  sonarcloud-main:
    name: SonarCloud Analysis (main)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1

      - name: Run tests with coverage (users_app)
        working-directory: users_app
        run: |
          poetry install --no-interaction --no-ansi
          poetry run pytest --cov=src --cov-report=xml:coverage.xml

      - name: Run tests with coverage (routes_app)
        working-directory: routes_app
        run: |
          poetry install --no-interaction --no-ansi
          poetry run pytest --cov=src --cov-report=xml:coverage.xml

      - name: Run tests with coverage (posts_app)
        working-directory: posts_app
        run: |
          poetry install --no-interaction --no-ansi
          poetry run pytest --cov=src --cov-report=xml:coverage.xml

      - name: Run tests with coverage (offers_app)
        working-directory: offers_app
        run: |
          poetry install --no-interaction --no-ansi
          poetry run pytest --cov=src --cov-report=xml:coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
